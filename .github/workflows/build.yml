name: Build Zyntavo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Builds an LGPL-only FFmpeg for Android (FreeType only, no GPL, no non-free parts).
  # If this job fails, the Android app still builds and uses its simpler engine.
  ffmpeg-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-android-arm64-lgpl-n7.1-v1
      - name: Build FFmpeg (LGPL) for Android arm64
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y pkg-config make
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          API=29
          CC="$TC/bin/aarch64-linux-android$API-clang"
          CXX="$TC/bin/aarch64-linux-android$API-clang++"
          PREFIX="$PWD/deps"
          mkdir -p "$PREFIX" ffmpeg-out/bin ffmpeg-out/source

          curl -fL https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.xz | tar xJ
          (cd freetype-2.13.2 && ./configure --prefix="$PREFIX" --host=aarch64-linux-android \
            --enable-static --disable-shared --with-pic --with-zlib=no --with-bzip2=no \
            --with-png=no --with-harfbuzz=no --with-brotli=no \
            CC="$CC" AR="$TC/bin/llvm-ar" RANLIB="$TC/bin/llvm-ranlib" \
            && make -j"$(nproc)" && make install)

          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git
          CONFIG="--enable-cross-compile --target-os=android --arch=aarch64 --cc=$CC --cxx=$CXX --ar=$TC/bin/llvm-ar --nm=$TC/bin/llvm-nm --ranlib=$TC/bin/llvm-ranlib --strip=$TC/bin/llvm-strip --sysroot=$TC/sysroot --pkg-config=pkg-config --pkg-config-flags=--static --enable-libfreetype --enable-pic --disable-shared --enable-static --disable-doc --disable-ffplay --disable-ffprobe --disable-debug --extra-cflags=-I$PREFIX/include\ -fPIE --extra-ldflags=-L$PREFIX/lib\ -pie"
          cd FFmpeg
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          ./configure --enable-cross-compile --target-os=android --arch=aarch64 \
            --cc="$CC" --cxx="$CXX" --ar="$TC/bin/llvm-ar" --nm="$TC/bin/llvm-nm" \
            --ranlib="$TC/bin/llvm-ranlib" --strip="$TC/bin/llvm-strip" --sysroot="$TC/sysroot" \
            --pkg-config=pkg-config --pkg-config-flags=--static \
            --enable-libfreetype --enable-pic --disable-shared --enable-static \
            --disable-doc --disable-ffplay --disable-ffprobe --disable-debug \
            --extra-cflags="-I$PREFIX/include -fPIE" --extra-ldflags="-L$PREFIX/lib -pie" \
            | tee ../configure.log
          # Stop here if anything GPL or non-free slipped in.
          grep -q "License: LGPL version 2.1 or later" ../configure.log
          make -j"$(nproc)"
          "$TC/bin/llvm-strip" ffmpeg
          cp ffmpeg ../ffmpeg-out/bin/libffmpeg.so
          git archive --format=tar.gz -o ../ffmpeg-out/source/ffmpeg-n7.1-source.tar.gz HEAD
          cp COPYING.LGPLv2.1 ../ffmpeg-out/source/
          cp ../freetype-2.13.2/docs/FTL.TXT ../ffmpeg-out/source/FreeType-FTL.txt
          cp ../configure.log ../ffmpeg-out/source/configure-output.txt
          echo "FFmpeg tag n7.1 commit $(git rev-parse HEAD)" > ../ffmpeg-out/source/BUILD-INFO.txt
          echo "FreeType 2.13.2, Android NDK arm64-v8a, API $API" >> ../ffmpeg-out/source/BUILD-INFO.txt
          echo "Configure: ./configure $CONFIG" >> ../ffmpeg-out/source/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-arm64
          path: ffmpeg-out/bin/libffmpeg.so
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          path: ffmpeg-out/source/*

  android:
    needs: ffmpeg-android
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Add FFmpeg (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-arm64
          path: composeApp/src/androidMain/jniLibs/arm64-v8a
      - run: gradle :composeApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zyntavo-Android-APK
          path: composeApp/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :composeApp:createDistributable --no-daemon
      - name: Add the LGPL build of FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $dest = "composeApp/build/compose/binaries/main/app/Zyntavo"
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName $dest
          $lic = Get-ChildItem ff -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$dest/FFmpeg-LICENSE.txt" }
          Copy-Item THIRD_PARTY_NOTICES.md $dest
          & "$dest/ffmpeg.exe" -version | Select-String "configuration"
      - uses: actions/upload-artifact@v4
        with:
          name: Zyntavo-Windows
          path: composeApp/build/compose/binaries/main/app
