name: Rust
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: Test the core
        run: cargo test -p zyntavo-core
      - name: Build the app
        run: cargo build --release -p zyntavo-app
      - uses: actions/upload-artifact@v4
        with:
          name: zyntavo-${{ matrix.os }}
          path: |
            target/release/zyntavo
            target/release/zyntavo.exe
          if-no-files-found: ignore
